name: flutter_bluetooth_serial
version: 0.4.0
description: A basic Flutter Bluetooth Serial library (LinkCOM vendored patch for Dart 3 and AGP 8)
homepage: https://github.com/edufolly/flutter_bluetooth_serial

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.edufolly.flutterbluetoothserial
        pluginClass: FlutterBluetoothSerialPlugin
