# Gradle 内存: Flutter 模板默认 -Xmx8G, 在本工程(小)属于浪费, 且会撑爆内存受限的
# 构建环境(如仅 4G 的 Docker 虚拟机 / CI)导致 daemon OOM 掉线。降到 2G 足够。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1g
# 降低并发以压低峰值内存(容器/CI 更稳)
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
