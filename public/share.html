<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LinkCOM · 共享端 (串口转发)</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('linkcom-theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
</head>
<body>
  <header>
    <span class="logo"><img class="logo-icon" src="logo.png" alt="Logo">LinkCOM</span>
    <span class="tag">共享端 SHARE</span>
    <span class="spacer"></span>
    <span class="stat"><span id="wsDot" class="status-dot"></span><span id="wsStat">未连接服务器</span></span>
    <span class="stat">房间: <b id="roomStat">-</b></span>
    <span class="stat">链接端: <b id="peerStat">0</b></span>
    <span class="stat">RX <b id="rxStat">0</b> · TX <b id="txStat">0</b></span>
    <button class="btn ghost" id="btnShareLink" type="button">分享房间链接</button>
    <a class="btn ghost" id="switchLink" href="link.html" style="text-decoration:none">切换到链接端</a>
  </header>

  <main>
    <div class="config-bar" id="configBar">
      <div class="config-head" id="configHead">
        <span class="chev">▾</span><span>房间配置</span>
        <a class="head-download" id="downloadDesktop" href="https://github.com/Neo-403/LinkCOM/releases" target="_blank" rel="noopener">桌面共享端(支持TCPServer/TCPClient)</a>
        <span class="hint" id="configSummary" style="font-weight:400;margin-left:auto"></span>
      </div>
      <div class="config-fields">
        <div class="field btn-field">
          <label>串口</label>
          <button class="btn" id="btnPick">选择 COM 口</button>
        </div>
        <div class="field btn-field">
          <label>&nbsp;</label>
          <button class="btn teal" id="btnOpen">打开串口</button>
        </div>
        <div class="field">
          <label>波特率</label>
          <select id="baud"></select>
        </div>
        <div class="field">
          <label>数据位</label>
          <select id="dbits"></select>
        </div>
        <div class="field">
          <label>停止位</label>
          <select id="sbits"></select>
        </div>
        <div class="field">
          <label>校验位</label>
          <select id="parity"></select>
        </div>
        <div class="field">
          <label>流控</label>
          <select id="flow"></select>
        </div>
        <div class="field room-field">
          <label>房间码 (共享ID)</label>
          <input class="room-input" id="room" placeholder="留空自动生成" maxlength="16">
        </div>
        <div class="field pwd-field">
          <label>密码 (可选)</label>
          <input id="pwd" placeholder="留空则无密码" maxlength="32" type="password">
        </div>
        <div class="field action-field">
          <label>&nbsp;</label>
          <button class="btn teal" id="btnShare">开始共享</button>
        </div>
      </div>
    </div>

    <div class="terminal-wrap">
      <div class="terminal-head">
        <span>显示:</span>
        <label class="hint"><input type="checkbox" id="modeText" checked> 文本</label>
        <label class="hint"><input type="checkbox" id="modeHex"> HEX</label>
        <label class="hint"><input type="checkbox" id="modeTs" checked> 时间戳</label>
        <span style="color:var(--border)">|</span>
        <label class="hint">编码
          <select id="encoding" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:12px"></select>
        </label>
        <label class="hint">聚合(ms)
          <input type="number" id="flushMs" min="0" max="2000" step="10" value="80" style="width:62px;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:12px">
        </label>
        <label class="hint">缓冲(KB)
          <input type="number" id="maxBuf" min="1" max="1024" step="1" value="4" style="width:56px;background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:12px">
        </label>
        <span class="spacer"></span>
        <label class="hint"><input type="checkbox" id="autoScroll" checked> 自动滚动</label>
        <button class="btn ghost" id="btnPause" style="padding:4px 10px;font-size:12px">暂停</button>
        <button class="btn ghost" id="btnClear" style="padding:4px 10px;font-size:12px">清空</button>
        <button class="btn ghost" id="btnExportHistory" style="padding:4px 10px;font-size:12px">导出历史</button>
      </div>
      <div id="terminal" class="split"></div>
    </div>

    <div class="send-bar" id="sendBar">
      <textarea id="sendText" placeholder="输入要发送到串口的内容 (Enter 发送, Shift+Enter 换行)"></textarea>
      <div class="actions">
        <button class="btn" id="btnSend">发送</button>
        <label class="hint"><input type="checkbox" id="sendHex"> HEX</label>
        <label class="hint"><input type="checkbox" id="sendCRLF" checked> 加\r\n</label>
      </div>
    </div>

    <!-- 快速发送面板 -->
    <section class="qs-panel" id="qsPanel">
      <div class="qs-bar">
        <strong>快速发送</strong>
        <span id="qsSummary" class="qs-summary">加载中…</span>
        <span class="grow"></span>
        <button id="qsToggle" class="btn sm ghost">展开</button>
        <button id="qsAddBtn" class="btn sm primary">添加</button>
        <button id="qsResetBtn" class="btn sm">重置为默认</button>
        <button id="qsClearBtn" class="btn sm danger">清空</button>
        <button id="qsImportBtn" class="btn sm">导入</button>
        <button id="qsExportBtn" class="btn sm">导出</button>
      </div>
      <div id="qsList" class="qs-list"></div>
      <div class="qs-controls">
        <div class="qs-ctl-row">
          <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="qsCheckAll" checked> 全选(仅发送勾选项)</label>
        </div>
        <div class="qs-ctl-row">
          <button id="qsSeqBtn" class="btn sm">顺序发送</button>
          <button id="qsPollBtn" class="btn sm">轮询发送</button>
          <button id="qsStopBtn" class="btn sm danger">停止</button>
          <span id="qsRunState" class="qs-run-state stop">空闲</span>
        </div>
        <input id="qsImportFile" type="file" accept="application/json,.json" class="hidden">
      </div>
    </section>

    <!-- 快速匹配面板 (独立模块, 可移除) -->
    <section class="sn-panel collapsed" id="snPanel">
      <div class="sn-bar">
        <strong>快速匹配</strong>
        <span id="snSummary" class="sn-summary">加载中…</span>
        <span class="grow"></span>
        <button id="snToggle" class="btn sm ghost">展开</button>
        <button id="snAddBtn" class="btn sm primary">添加</button>
        <button id="snClearBtn" class="btn sm danger">清空</button>
        <button id="snImportBtn" class="btn sm">导入</button>
        <button id="snExportBtn" class="btn sm">导出</button>
      </div>
      <div class="sn-body">
        <div id="snRules" class="sn-rules"></div>
      </div>
      <input id="snImportFile" type="file" accept="application/json,.json" class="hidden">
    </section>

  </main>

  <!-- 快速发送 编辑/添加 模态框 -->
  <div id="qsModalMask" class="modal-mask hidden" style="display:none">
    <div class="modal">
      <h3>快速发送条目</h3>
      <div class="row">
        <label>名称<input id="qsEditName" type="text" placeholder="例如: 查询版本" maxlength="40"></label>
      </div>
      <div class="row">
        <label>发送内容
          <textarea id="qsEditData" placeholder="文本内容, 或 HEX 模式下的 'AA BB CC'"></textarea>
        </label>
      </div>
      <div class="row">
        <label style="flex-direction:row;align-items:center;gap:6px"><input id="qsEditHex" type="checkbox"> HEX 模式</label>
        <label style="flex-direction:row;align-items:center;gap:6px"><input id="qsEditCrlf" type="checkbox" checked> 文本模式追加 \r\n</label>
        <label>本条延迟(ms)<input id="qsEditDelay" type="number" value="0" min="0" inputmode="numeric"></label>
      </div>
      <div class="modal-actions">
        <button class="btn" id="qsEditCancel">取消</button>
        <button class="btn primary" id="qsEditSave">保存</button>
      </div>
    </div>
  </div>

  <div class="app-credit" id="appCredit"></div>

  <div class="toast hidden" id="hint"><span class="toast-text"></span><button class="toast-close" id="hintClose" title="关闭">×</button></div>


  <script>
    // 下载桌面端仅 Windows 可用: 非 Windows 系统隐藏入口
    (function () {
      var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
      var isWin = /^win/i.test(p) || /Windows|Win32|Win64|WinNT/i.test(navigator.userAgent || '');
      if (!isWin) {
        var el = document.getElementById('downloadDesktop');
        if (el) el.style.display = 'none';
      }
    })();
  </script>
  <script src="version.js"></script>
  <script src="gbk.js"></script>
  <script src="serial-config.js"></script>
  <script src="quick.js"></script>
  <script src="sniffer.js"></script>
  <script src="share.js"></script>
  <script src="theme.js"></script>
  <script>
    (function () {
      var v = window.APP_VERSION || '0.0.0';
      var el = document.getElementById('appCredit');
      if (el) el.innerHTML = '<a href="https://github.com/Neo-403/LinkCOM" target="_blank" rel="noopener">LinkCOM v' + v + ' | by ZWZW</a>';
    })();
  </script>
</body>
</html>
