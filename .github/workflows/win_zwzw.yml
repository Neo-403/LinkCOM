name: 编译 Windows共享端

on:  # 定义触发工作流的事件
  # release:  # 当发布新的GitHub release时触发
  #   types: [ published ]  # 当发布新的GitHub release时触发
  workflow_dispatch:  # 手动触发
    inputs:  # 输入的参数
      # tag:  # 输入的标签
      #   description: '构建的版本号'  # 手动触发时输入的标签描述
      #   required: true  # 必须输入
      #   default: 'test'  # 默认标签为'test'
  # schedule:  # 定时触发
  #   # 每天 UTC 时间 00:00 运行 (Cron 语法)
  #   - cron: '0 0 * * *'
  # workflow_run:
  #   workflows: ["GoReleaser Workflow"]  # 指定工作流完成时触发
  #   types: [completed]  # 当工作流完成时触发
  # push:
  #   branches: [ "main", "master" ]  # 当指定分支有代码推送时触发
  # pull_request:
  #   branches: [ "main", "master" ]  # 当指定分支有代码拉取请求时触发

permissions:  # 工作流权限
  contents: write  # 工作流需要读取仓库内容的权限

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 读取版本号
        id: ver
        shell: bash
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller websocket-client pyserial PySide6

      - name: 同步 Web 版本号
        run: python sync_version.py

      - name: 编译单文件 EXE
        shell: bash
        run: |
          pyinstaller --noconfirm --clean \
            --name "LinkCOM_Win_v${{ env.VERSION }}" \
            --windowed --onefile \
            --icon "desktop/logo.ico" \
            --add-data "desktop/logo.png;." \
            --add-data "VERSION;." \
            --hidden-import=websocket \
            --hidden-import=websocket-client \
            --hidden-import=serial \
            --hidden-import=PySide6 \
            desktop/main.py

      - name: 校验产物
        shell: bash
        run: ls -lh "dist/LinkCOM_Win_v${{ env.VERSION }}.exe"

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LinkCOM v${{ env.VERSION }}
          files: dist/LinkCOM_Win_v${{ env.VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
